# Render Blueprint: deploys both parts of Veriflow from the main branch.
# Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file and
# asks for every value marked "sync: false" (secrets are typed in Render, never committed).
#
# Server: Docker image with Playwright + Chromium (server/Dockerfile), runs the API and the checker loop.
# Client: static site built by Vite.

services:
  # ---------- Backend: Express API + checker loop ----------
  - type: web
    name: veriflow-api
    runtime: docker
    plan: free # 512 MB RAM. If Render logs say "out of memory" during checks, switch to starter
    branch: main
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CHECKER_LOOP # this server is the one that runs the checker loop
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL # the client's Render URL, e.g. https://veriflow-web.onrender.com
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_MOCK
        value: "false"
      - key: PAYPAL_WORKER_EMAIL # the sandbox business account that owns the PayPal app
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false

  # ---------- Frontend: React (Vite) static site ----------
  - type: web
    name: veriflow-web
    runtime: static
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # React Router: send every page (e.g. /jobs/123) to index.html so a refresh doesn't 404
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL # the server's Render URL, e.g. https://veriflow-api.onrender.com
        sync: false
      - key: VITE_PAYPAL_CLIENT_ID # same Client ID as the server, NOT the secret
        sync: false
      - key: VITE_USE_FAKE_API
        value: "false"
