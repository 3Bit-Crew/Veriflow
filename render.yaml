# Render Blueprint: deploys both parts of Veriflow from the main branch.
# Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file and
# asks for every value marked "sync: false" (secrets are typed in Render, never committed).
#
# Day 3: server runs as a plain Node service (no Playwright, the checker loop is not started yet).
# Day 4: the server switches to a Dockerfile with Playwright (runtime: docker).

services:
  # ---------- Backend: Express API ----------
  - type: web
    name: veriflow-api
    runtime: node
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD # browsers come with the Docker image on day 4
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL # the client's Render URL, e.g. https://veriflow-web.onrender.com
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_MOCK
        value: "false"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false

  # ---------- Frontend: React (Vite) static site ----------
  - type: web
    name: veriflow-web
    runtime: static
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # React Router: send every page (e.g. /jobs/123) to index.html so a refresh doesn't 404
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL # the server's Render URL, e.g. https://veriflow-api.onrender.com
        sync: false
      - key: VITE_PAYPAL_CLIENT_ID # same Client ID as the server, NOT the secret
        sync: false
      - key: VITE_USE_FAKE_API
        value: "false"
